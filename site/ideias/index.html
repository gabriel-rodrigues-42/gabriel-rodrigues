<style>
  main { max-width: 760px; margin: 0 auto; padding: var(--espaco-7) var(--espaco-4) 200px; }
  nav a { font-weight: var(--peso-forte); text-decoration: none; color: var(--azul); }
  h1 { font-size: var(--tamanho-6); line-height: 1.1; color: var(--azul); margin: var(--espaco-5) 0 var(--espaco-3); }
  .lead { font-size: var(--tamanho-3); color: var(--texto-suave); margin: 0 0 var(--espaco-5); }

  .indice { list-style: none; padding: 0; margin: var(--espaco-5) 0 0; display: flex; flex-wrap: wrap; gap: var(--espaco-2); }
  .indice a { display: inline-block; text-decoration: none; color: var(--azul); background: var(--branco); font-weight: var(--peso-forte); font-size: var(--tamanho-1); padding: 6px 12px; border-radius: var(--forma-pilula); border: 2px solid var(--azul-claro); }

  .ideias { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--espaco-6); margin-top: var(--espaco-6); }
  .ideia { scroll-margin-top: var(--espaco-5); }
  .ideia h2 { font-size: var(--tamanho-titulo-cartao); line-height: 1.15; color: var(--azul); margin: var(--espaco-3) 0 0; }
  .ideia h3 { font-size: var(--tamanho-2); text-transform: uppercase; letter-spacing: .06em; color: var(--verde-escuro); margin: var(--espaco-5) 0 var(--espaco-2); }
  .ideia p { margin: 0 0 var(--espaco-3); }
  .gancho { font-size: var(--tamanho-4); font-weight: var(--peso-forte); color: var(--texto); line-height: 1.35; margin-top: var(--espaco-4) !important; }

  .critica { background: var(--creme); border-radius: var(--forma-opcao); padding: var(--espaco-3) var(--espaco-4); margin-bottom: var(--espaco-3); }
  .critica .rotulo { display: block; font-size: var(--tamanho-1); font-weight: var(--peso-forte); text-transform: uppercase; letter-spacing: .05em; color: var(--texto-suave); }
  .critica .pergunta-critica { font-weight: var(--peso-forte); }
  .critica .pendente { color: var(--texto-suave); font-style: italic; }
  .conversa { background: var(--azul-claro); border-radius: var(--forma-cartao); padding: var(--espaco-4); margin-top: var(--espaco-5); }
  .conversa p { margin: 0; font-weight: var(--peso-forte); color: var(--azul); font-size: var(--tamanho-3); }
  .hashtags { display: flex; flex-wrap: wrap; gap: var(--espaco-2); align-items: center; margin-top: var(--espaco-4); padding: 2px; }
  .hashtag { background: var(--branco); color: var(--verde-escuro); font-weight: var(--peso-forte); padding: 6px 12px; border-radius: var(--forma-selo); }
  .copiar { padding: 6px 14px; font-size: var(--tamanho-1); background: var(--branco); }
  .links { margin-top: var(--espaco-4); display: flex; flex-wrap: wrap; gap: var(--espaco-3); }
  .links a { color: var(--verde-escuro); font-weight: var(--peso-forte); }
</style>

<body>
<gr-cabecalho></gr-cabecalho>
<div class="bolha amarela"></div><div class="bolha verde"></div>

<main>
  <span class="selo amarelo" style="margin-top: var(--espaco-5)">Portfólio de ideias</span>
  <h1>Ideias para <span class="destaque">conversar</span></h1>
  <p class="lead">Cada ideia diz o problema, a proposta e as críticas mais duras que eu já ouvi, com a minha resposta. Para ouvir com legendas, ligue o modo leitura no rodapé.</p>

  <ul class="indice" id="indice" data-leitura="pular"></ul>
  <div class="ideias" id="ideias"></div>
</main>

<gr-contribuir tipo="nova"></gr-contribuir>
<gr-rodape></gr-rodape>

<script src="ideias.js"></script>
<script src="montar.js"></script>
</body>
