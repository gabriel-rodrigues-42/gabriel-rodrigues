name: Dados da página Partidos (votações da Câmara)

# Baixa as votações nominais da API de Dados Abertos da Câmara (scripts/partidos/gerar_votacoes.py)
# e grava site/partidos/dados/ no mesmo branch.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/partidos/**
      - .github/workflows/dados-partidos.yml

permissions:
  contents: write

concurrency:
  group: dados-partidos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar os dados
        shell: bash
        run: python3 scripts/partidos/gerar_votacoes.py 2>&1 | tee gerar.log

      - name: Resumo
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -150 gerar.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Gravar no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/partidos/dados
          if git diff --cached --quiet; then
            echo "Dados sem mudança."
          else
            git commit -m "Atualiza as votações da página Partidos (Câmara)"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi
